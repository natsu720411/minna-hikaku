name: Site health audit

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/audit-live-product-images.mjs
        if: github.event_name == 'push'
        continue-on-error: true
      - name: Save Rakuten sample audit
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-affiliate-check
          path: rakuten-audit-result.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run audit:external
        if: github.event_name != 'push'
