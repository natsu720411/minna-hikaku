name: Minna Hikaku free Google API weekly SEO audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/weekly_seo_audit.py'
      - 'scripts/tests/test_weekly_seo_audit.py'
      - '.github/workflows/minna-hikaku-free-seo-audit.yml'
  schedule:
    - cron: '37 23 * * 0'
permissions:
  contents: read
concurrency:
  group: minna-free-seo-audit
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify analysis logic
        run: python -m unittest discover -s scripts/tests -p test_weekly_seo_audit.py -v
      - name: Check Google setup
        id: config
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "## Google API認証の設定待ち" >> "$GITHUB_STEP_SUMMARY"
            echo "Secret GOOGLE_SERVICE_ACCOUNT_JSON が未設定。docs/GOOGLE_FREE_ANALYTICS_SETUP.md を確認してください。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install official Google authentication
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2.31,<3'
      - name: Read Google Search Console and optional GA4
        if: steps.config.outputs.configured == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          SEO_PUBLISH_DETAILS: ${{ vars.SEO_PUBLISH_DETAILS }}
          GSC_SITE_URL: https://minna-hikaku.vercel.app/
          REPORT_PATH: seo-report.md
        run: python scripts/weekly_seo_audit.py
      - name: Save the Japanese report
        if: steps.config.outputs.configured == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: minna-seo-weekly-report
          path: seo-report.md
          retention-days: 14
          if-no-files-found: error
