<!doctype html>
<html lang="ja">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f6cf9" />
    <meta name="description" content="2026年最新ワイヤレスイヤホン11機種を、価格・音質・ノイズキャンセリング・バッテリーなど重視ポイント別に比較。3問であなた向けランキングを作れます。" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://minna-hikaku.vercel.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/guides.css" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="みんなの比較表｜重視ポイントで変わるイヤホンランキング" />
    <meta property="og:description" content="予算と重視ポイントを選ぶだけ。2026年最新イヤホン11機種から、あなた向けの比較ランキングを作ります。" />
    <meta property="og:url" content="https://minna-hikaku.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <title>ワイヤレスイヤホン比較 2026｜11機種を条件別比較｜みんなの比較表</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "みんなの比較表",
            "url": "https://minna-hikaku.vercel.app/",
            "description": "重視ポイントでランキングが変わるワイヤレスイヤホン比較サイト"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "相性点は商品の絶対評価ですか？",
                "acceptedAnswer": {"@type": "Answer", "text": "いいえ。選んだ重視ポイントとの相性を表す点数で、条件によって点数や順位が変わります。"}
              },
              {
                "@type": "Question",
                "name": "表示価格は実際の販売価格と同じですか？",
                "acceptedAnswer": {"@type": "Answer", "text": "メーカー公式サイトの参考価格を基準にしていますが、セールや販売店によって実売価格は変動します。"}
              },
              {
                "@type": "Question",
                "name": "ランキングは広告で変わりますか？",
                "acceptedAnswer": {"@type": "Answer", "text": "相性点の計算には広告掲載の有無を使いません。"}
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/market-links.js" defer></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const root = document.getElementById('root');
        const syncProductCount = () => {
          document.querySelectorAll('.trust-row span').forEach((el) => {
            if (el.textContent.includes('製品を比較') && el.textContent !== '✓ 11製品を比較') {
              el.textContent = '✓ 11製品を比較';
            }
          });
        };
        syncProductCount();
        if (root) new MutationObserver(syncProductCount).observe(root, { childList: true, subtree: true });
      });
    </script>
  </body>
</html>
